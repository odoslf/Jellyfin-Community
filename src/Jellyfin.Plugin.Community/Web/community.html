<!DOCTYPE html>
<html>
<head><title>Comunidad</title></head>
<body>
<div id="CommunityPage" data-role="page" class="page type-interior" data-title="Comunidad" data-controller="CommunityPageController" data-require="emby-button,emby-input,emby-select,emby-checkbox">
<style>
#CommunityPage .community-shell{max-width:1100px;margin:0 auto;padding:5.4rem 1.2rem 2rem}.community-toolbar{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}.community-toolbar .search{flex:1;min-width:13rem}.community-tabs{display:flex;gap:.3rem;overflow:auto;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:1rem}.community-tab{border:0;background:transparent;padding:.8rem 1rem;color:inherit;cursor:pointer;border-bottom:3px solid transparent}.community-tab.active{border-bottom-color:var(--theme-primary-color,#00a4dc);font-weight:700}.community-grid{display:grid;grid-template-columns:16rem minmax(0,1fr);gap:1rem}.community-card{background:rgba(255,255,255,.06);border-radius:.45rem;padding:1rem;margin-bottom:.8rem}.community-category{display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:.65rem;border-radius:.3rem;cursor:pointer}.community-category:hover,.community-category.active{background:rgba(255,255,255,.1)}.community-thread{cursor:pointer}.community-thread h3{margin:.1rem 0 .45rem;font-size:1.08rem}.community-meta{font-size:.86rem;opacity:.72;display:flex;gap:.7rem;flex-wrap:wrap}.community-tags{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.45rem}.community-tag{font-size:.75rem;padding:.15rem .45rem;border-radius:1rem;background:rgba(255,255,255,.11)}.community-post{position:relative}.community-post .body{line-height:1.55;overflow-wrap:anywhere}.community-post .body pre{overflow:auto;padding:.8rem;background:rgba(0,0,0,.25);border-radius:.3rem}.community-post .body blockquote{border-left:.25rem solid var(--theme-primary-color,#00a4dc);margin-left:0;padding-left:.9rem}.community-actions{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.75rem}.community-small-button{border:0;border-radius:.3rem;padding:.35rem .65rem;cursor:pointer;color:inherit;background:rgba(255,255,255,.1)}.community-small-button:hover{background:rgba(255,255,255,.18)}.community-spoiler{border:1px dashed rgba(255,255,255,.35);border-radius:.35rem;padding:.8rem}.community-spoiler.locked .spoiler-content{display:none}.community-alert{padding:.8rem;border-radius:.35rem;background:rgba(255,180,0,.15);margin-bottom:1rem}.community-error{background:rgba(220,50,50,.18)}.community-empty{opacity:.72;padding:2rem;text-align:center}.community-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem}.community-modal[hidden]{display:none}.community-dialog{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--background-color,#181818);color:inherit;padding:1.2rem;border-radius:.55rem;box-shadow:0 1rem 3rem rgba(0,0,0,.5)}.community-dialog textarea{min-height:12rem}.community-form-row{margin-bottom:.9rem}.community-form-row label{display:block;margin-bottom:.35rem}.community-pager{display:flex;justify-content:center;align-items:center;gap:.8rem;margin:1rem}.community-notification.unread{border-left:4px solid var(--theme-primary-color,#00a4dc)}.community-badge{font-size:.72rem;padding:.15rem .4rem;border-radius:.3rem;background:var(--theme-primary-color,#00a4dc);color:#fff}.community-poll-option{display:flex;gap:.6rem;align-items:center;padding:.4rem 0}.community-admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.8rem}.community-section-heading,.community-admin-row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap}.community-admin-row{padding:.7rem 0;border-top:1px solid rgba(255,255,255,.08)}.community-section-heading h3{margin:0}.community-stat strong{display:block;font-size:1.5rem}.community-attachments{display:flex;gap:.5rem;flex-wrap:wrap}.community-attachments img{max-width:180px;max-height:130px;border-radius:.3rem}.community-hidden{display:none!important}@media(max-width:760px){#CommunityPage .community-shell{padding:5rem .7rem 1.5rem}.community-grid{grid-template-columns:1fr}.community-sidebar{display:flex;overflow:auto;gap:.35rem}.community-category{width:auto;white-space:nowrap}.community-dialog{padding:.9rem}}
</style>
<div class="community-shell">
    <div class="community-toolbar">
        <button id="communityClose" type="button" class="community-small-button" aria-label="Volver">← Volver</button>
        <h1 style="margin:0;flex:0 0 auto">Comunidad</h1>
        <input id="communitySearch" class="search" is="emby-input" type="search" placeholder="Buscar conversaciones">
        <button id="communitySearchButton" is="emby-button" class="raised">Buscar</button>
        <button id="communityNewThread" is="emby-button" class="raised button-submit">Nuevo tema</button>
    </div>
    <div id="communityBanner"></div>
    <div class="community-tabs">
        <button class="community-tab active" data-view="threads">Actividad</button>
        <button class="community-tab" data-view="followed">Siguiendo</button>
        <button class="community-tab" data-view="notifications">Notificaciones</button>
        <button class="community-tab community-hidden" id="communityModerationTab" data-view="moderation">Moderación</button>
        <button class="community-tab community-hidden" id="communityAdminTab" data-view="admin">Administración</button>
    </div>
    <div id="communityMain"><div class="community-empty">Cargando Comunidad…</div></div>
</div>
<div id="communityModal" class="community-modal" hidden><div class="community-dialog"><div id="communityModalBody"></div></div></div>
</div>
</body>
</html>
