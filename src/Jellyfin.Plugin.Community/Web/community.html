<!DOCTYPE html>
<html>
<head><title>Comunidad</title></head>
<body>
<div id="CommunityPage" data-role="page" class="page type-interior" data-require="emby-button,emby-input,emby-select,emby-checkbox">
<style>
#CommunityPage .community-shell{max-width:1100px;margin:0 auto;padding:1.2rem}.community-toolbar{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}.community-toolbar .search{flex:1;min-width:13rem}.community-tabs{display:flex;gap:.3rem;overflow:auto;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:1rem}.community-tab{border:0;background:transparent;padding:.8rem 1rem;color:inherit;cursor:pointer;border-bottom:3px solid transparent}.community-tab.active{border-bottom-color:var(--theme-primary-color,#00a4dc);font-weight:700}.community-grid{display:grid;grid-template-columns:16rem minmax(0,1fr);gap:1rem}.community-card{background:rgba(255,255,255,.06);border-radius:.45rem;padding:1rem;margin-bottom:.8rem}.community-category{display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:.65rem;border-radius:.3rem;cursor:pointer}.community-category:hover,.community-category.active{background:rgba(255,255,255,.1)}.community-thread{cursor:pointer}.community-thread h3{margin:.1rem 0 .45rem;font-size:1.08rem}.community-meta{font-size:.86rem;opacity:.72;display:flex;gap:.7rem;flex-wrap:wrap}.community-tags{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.45rem}.community-tag{font-size:.75rem;padding:.15rem .45rem;border-radius:1rem;background:rgba(255,255,255,.11)}.community-post{position:relative}.community-post .body{line-height:1.55;overflow-wrap:anywhere}.community-post .body pre{overflow:auto;padding:.8rem;background:rgba(0,0,0,.25);border-radius:.3rem}.community-post .body blockquote{border-left:.25rem solid var(--theme-primary-color,#00a4dc);margin-left:0;padding-left:.9rem}.community-actions{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.75rem}.community-small-button{border:0;border-radius:.3rem;padding:.35rem .65rem;cursor:pointer;color:inherit;background:rgba(255,255,255,.1)}.community-small-button:hover{background:rgba(255,255,255,.18)}.community-spoiler{border:1px dashed rgba(255,255,255,.35);border-radius:.35rem;padding:.8rem}.community-spoiler.locked .spoiler-content{display:none}.community-alert{padding:.8rem;border-radius:.35rem;background:rgba(255,180,0,.15);margin-bottom:1rem}.community-error{background:rgba(220,50,50,.18)}.community-empty{opacity:.72;padding:2rem;text-align:center}.community-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem}.community-modal[hidden]{display:none}.community-dialog{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--background-color,#181818);color:inherit;padding:1.2rem;border-radius:.55rem;box-shadow:0 1rem 3rem rgba(0,0,0,.5)}.community-dialog textarea{min-height:12rem}.community-form-row{margin-bottom:.9rem}.community-form-row label{display:block;margin-bottom:.35rem}.community-pager{display:flex;justify-content:center;align-items:center;gap:.8rem;margin:1rem}.community-notification.unread{border-left:4px solid var(--theme-primary-color,#00a4dc)}.community-badge{font-size:.72rem;padding:.15rem .4rem;border-radius:.3rem;background:var(--theme-primary-color,#00a4dc);color:#fff}.community-poll-option{display:flex;gap:.6rem;align-items:center;padding:.4rem 0}.community-admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.8rem}.community-stat strong{display:block;font-size:1.5rem}.community-attachments{display:flex;gap:.5rem;flex-wrap:wrap}.community-attachments img{max-width:180px;max-height:130px;border-radius:.3rem}.community-hidden{display:none!important}@media(max-width:760px){#CommunityPage .community-shell{padding:.7rem}.community-grid{grid-template-columns:1fr}.community-sidebar{display:flex;overflow:auto;gap:.35rem}.community-category{width:auto;white-space:nowrap}.community-dialog{padding:.9rem}}
</style>
<div class="community-shell">
    <div class="community-toolbar">
        <h1 style="margin:0;flex:0 0 auto">Comunidad</h1>
        <input id="communitySearch" class="search" is="emby-input" type="search" placeholder="Buscar conversaciones">
        <button id="communitySearchButton" is="emby-button" class="raised">Buscar</button>
        <button id="communityNewThread" is="emby-button" class="raised button-submit">Nuevo tema</button>
    </div>
    <div id="communityBanner"></div>
    <div class="community-tabs">
        <button class="community-tab active" data-view="threads">Actividad</button>
        <button class="community-tab" data-view="followed">Siguiendo</button>
        <button class="community-tab" data-view="notifications">Notificaciones</button>
        <button class="community-tab community-hidden" id="communityModerationTab" data-view="moderation">Moderación</button>
        <button class="community-tab community-hidden" id="communityAdminTab" data-view="admin">Administración</button>
    </div>
    <div id="communityMain"></div>
</div>
<div id="communityModal" class="community-modal" hidden><div class="community-dialog"><div id="communityModalBody"></div></div></div>
<script type="text/javascript">
(() => {
'use strict';
const root = document.querySelector('#CommunityPage');
const main = root.querySelector('#communityMain');
const banner = root.querySelector('#communityBanner');
const modal = root.querySelector('#communityModal');
const modalBody = root.querySelector('#communityModalBody');
const state = { me:null, categories:[], categoryId:null, itemId:null, itemName:null, view:'threads', page:1, pageSize:25, query:'', currentThread:null };
const apiUrl = path => ApiClient.getUrl('Community/api/v1/' + path.replace(/^\//,''));
const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const qs = values => Object.entries(values).filter(([,v]) => v !== null && v !== undefined && v !== '').map(([k,v]) => encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');
async function request(path, options={}) {
    const config = { type: options.method || 'GET', url: apiUrl(path), dataType: options.dataType || 'json' };
    if (options.body !== undefined) { config.contentType='application/json'; config.data=JSON.stringify(options.body); }
    try { return await ApiClient.ajax(config); }
    catch (error) {
        let message = error?.statusText || error?.message || 'Error de Community';
        try { const body = JSON.parse(error?.responseText || '{}'); if (body.message) message = body.message; } catch (_) {}
        throw new Error(message);
    }
}
function formatDate(value){try{return new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(new Date(value));}catch(_){return value;}}
function setBanner(message, error=false){banner.innerHTML=message?`<div class="community-alert ${error?'community-error':''}">${esc(message)}</div>`:'';}
function closeModal(){modal.hidden=true;modalBody.innerHTML='';}
function openModal(html){modalBody.innerHTML=html;modal.hidden=false;const close=modalBody.querySelector('[data-close]');if(close)close.addEventListener('click',closeModal);}
modal.addEventListener('click',event=>{if(event.target===modal)closeModal();});
function updateTabs(){root.querySelectorAll('.community-tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.view===state.view));}
function parseContext(){const hash=location.hash||'';const query=hash.includes('?')?hash.split('?')[1]:location.search.slice(1);const params=new URLSearchParams(query);const item=params.get('itemId');if(item&&/^[0-9a-f-]{36}$/i.test(item)){state.itemId=item;state.itemName=params.get('itemName')||'Contenido de Jellyfin';}}
async function init(){Dashboard.showLoadingMsg();try{parseContext();[state.me,state.categories]=await Promise.all([request('me'),request('categories')]);root.querySelector('#communityModerationTab').classList.toggle('community-hidden',!state.me.isModerator);root.querySelector('#communityAdminTab').classList.toggle('community-hidden',!state.me.isAdministrator);if(state.me.isSuspended)setBanner('Su cuenta está suspendida en Community.',true);else if(state.me.isMuted)setBanner('Su cuenta puede leer, pero está temporalmente silenciada.',true);await render();}catch(error){setBanner(error.message,true);main.innerHTML='<div class="community-empty">No se pudo cargar Community.</div>';}finally{Dashboard.hideLoadingMsg();}}
async function render(){updateTabs();if(state.view==='notifications')return renderNotifications();if(state.view==='moderation')return renderModeration();if(state.view==='admin')return renderAdmin();return renderThreads();}
function categorySidebar(){return `<aside class="community-sidebar community-card"><button class="community-category ${state.categoryId===null?'active':''}" data-category="">Todas</button>${state.categories.map(c=>`<button class="community-category ${state.categoryId===c.id?'active':''}" data-category="${c.id}">${esc(c.name)} <span class="community-meta">${c.threadCount}</span></button>`).join('')}</aside>`;}
async function renderThreads(){Dashboard.showLoadingMsg();try{const followed=state.view==='followed';const params={categoryId:state.categoryId,itemId:state.itemId,q:state.query,sort:'activity',page:state.page,pageSize:state.pageSize,followedOnly:followed};const data=await request('threads?'+qs(params));main.innerHTML=`${state.itemId?`<div class="community-alert">Debates vinculados a <strong>${esc(state.itemName)}</strong></div>`:''}<div class="community-grid">${categorySidebar()}<section><div id="communityThreadList">${data.items.length?data.items.map(threadCard).join(''):'<div class="community-empty community-card">No hay conversaciones.</div>'}</div>${pager(data)}</section></div>`;main.querySelectorAll('[data-category]').forEach(button=>button.addEventListener('click',()=>{state.categoryId=button.dataset.category?Number(button.dataset.category):null;state.page=1;renderThreads();}));main.querySelectorAll('[data-thread]').forEach(card=>card.addEventListener('click',()=>openThread(Number(card.dataset.thread))));wirePager(data,renderThreads);}catch(error){setBanner(error.message,true);}finally{Dashboard.hideLoadingMsg();}}
function threadCard(thread){return `<article class="community-card community-thread" data-thread="${thread.id}"><h3>${thread.isPinned?'📌 ':''}${esc(thread.title)} ${thread.isLocked?'<span class="community-badge">cerrado</span>':''}</h3><div class="community-meta"><span>${esc(thread.categoryName)}</span><span>${esc(thread.authorName)}</span><span>${formatDate(thread.lastActivityUtc)}</span><span>${thread.replyCount} respuestas</span><span>${thread.viewCount} vistas</span>${thread.itemName?`<span>🎬 ${esc(thread.itemName)}</span>`:''}</div><div class="community-tags">${(thread.tags||[]).map(tag=>`<span class="community-tag">${esc(tag)}</span>`).join('')}</div></article>`;}
function pager(data){const pages=Math.max(1,Math.ceil(data.total/data.pageSize));return `<div class="community-pager"><button class="community-small-button" data-page="${Math.max(1,data.page-1)}" ${data.page<=1?'disabled':''}>Anterior</button><span>${data.page} / ${pages}</span><button class="community-small-button" data-page="${Math.min(pages,data.page+1)}" ${data.page>=pages?'disabled':''}>Siguiente</button></div>`;}
function wirePager(data,callback){main.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{state.page=Number(button.dataset.page);callback();}));}
async function openThread(id){Dashboard.showLoadingMsg();try{const [thread,posts]=await Promise.all([request(`threads/${id}`),request(`threads/${id}/posts?page=1&pageSize=100`)]);state.currentThread=thread;main.innerHTML=`<button class="community-small-button" id="communityBack">← Volver</button><article class="community-card"><h2>${esc(thread.thread.title)}</h2><div class="community-meta"><span>${esc(thread.thread.categoryName)}</span><span>${esc(thread.thread.authorName)}</span><span>${formatDate(thread.thread.createdUtc)}</span>${thread.thread.itemId?`<a href="#!/details?id=${encodeURIComponent(thread.thread.itemId)}">Abrir contenido</a>`:''}</div>${renderPoll(thread.poll)}<div class="community-actions"><button class="community-small-button" id="communityFollow">${thread.thread.isFollowing?'Dejar de seguir':'Seguir'}</button>${thread.canModerate?'<button class="community-small-button" id="communityModerate">Moderar</button>':''}</div></article><section id="communityPosts">${posts.items.map(postCard).join('')}</section>${!thread.thread.isLocked&&!state.me.isMuted?replyForm(id):'<div class="community-alert">La conversación no admite nuevas respuestas.</div>'}`;root.querySelector('#communityBack').addEventListener('click',render);root.querySelector('#communityFollow').addEventListener('click',async()=>{await request(`threads/${id}/follow`,{method:thread.thread.isFollowing?'DELETE':'POST'});openThread(id);});const mod=root.querySelector('#communityModerate');if(mod)mod.addEventListener('click',()=>moderationDialog(thread.thread));wirePosts(id);const reply=root.querySelector('#communityReplyForm');if(reply)wireReply(reply,id);wirePoll(id);await request(`threads/${id}/read`,{method:'POST'});}catch(error){setBanner(error.message,true);}finally{Dashboard.hideLoadingMsg();}}
function postCard(post){const body=post.containsSpoiler?`<div class="community-spoiler ${post.spoilerUnlocked?'':'locked'}"><button class="community-small-button spoiler-toggle">${post.spoilerUnlocked?'Ocultar':'Mostrar spoiler'}${post.spoilerLabel?' — '+esc(post.spoilerLabel):''}</button><div class="spoiler-content body">${post.bodyHtml}</div></div>`:`<div class="body">${post.bodyHtml}</div>`;return `<article class="community-card community-post" data-post="${post.id}"><div class="community-meta"><strong>${esc(post.authorName)}</strong><span>${formatDate(post.createdUtc)}</span>${post.isEdited?'<span>editado</span>':''}${post.isHidden?'<span class="community-badge">oculto</span>':''}</div>${body}<div class="community-attachments">${(post.attachments||[]).map(a=>`<a href="${apiUrl(a.url.replace(/^Community\/api\/v1\//,''))}" target="_blank"><img src="${apiUrl(a.url.replace(/^Community\/api\/v1\//,''))}" alt="${esc(a.originalName)}"></a>`).join('')}</div><div class="community-actions">${['like','love','laugh','insightful'].map(r=>`<button class="community-small-button" data-reaction="${r}">${r} ${(post.reactions&&post.reactions[r])||0}</button>`).join('')}<button class="community-small-button" data-quote>Responder</button><button class="community-small-button" data-report>Denunciar</button>${post.canEdit?'<button class="community-small-button" data-edit>Editar</button>':''}${post.canModerate?'<button class="community-small-button" data-hide>Ocultar</button>':''}</div></article>`;}
function replyForm(threadId){return `<form id="communityReplyForm" class="community-card"><h3>Responder</h3><textarea id="communityReplyBody" is="emby-input" required maxlength="20000" placeholder="Escriba su respuesta en Markdown"></textarea><input id="communityParentPost" type="hidden"><div class="checkboxContainer"><label><input id="communityReplySpoiler" type="checkbox" is="emby-checkbox"><span>Contiene spoilers</span></label></div><button is="emby-button" class="raised button-submit" type="submit">Publicar respuesta</button></form>`;}
function wireReply(form,threadId){form.addEventListener('submit',async event=>{event.preventDefault();Dashboard.showLoadingMsg();try{await request(`threads/${threadId}/posts`,{method:'POST',body:{body:root.querySelector('#communityReplyBody').value,parentPostId:Number(root.querySelector('#communityParentPost').value)||null,containsSpoiler:root.querySelector('#communityReplySpoiler').checked,spoilerItemId:state.itemId,spoilerLabel:null}});await openThread(threadId);}catch(error){alert(error.message);}finally{Dashboard.hideLoadingMsg();}});}
function wirePosts(threadId){root.querySelectorAll('.spoiler-toggle').forEach(button=>button.addEventListener('click',()=>button.parentElement.classList.toggle('locked')));root.querySelectorAll('[data-post]').forEach(card=>{const postId=Number(card.dataset.post);card.querySelectorAll('[data-reaction]').forEach(button=>button.addEventListener('click',async()=>{await request(`posts/${postId}/reaction`,{method:'PUT',body:{reaction:button.dataset.reaction}});openThread(threadId);}));card.querySelector('[data-quote]')?.addEventListener('click',()=>{root.querySelector('#communityParentPost').value=postId;root.querySelector('#communityReplyBody').focus();root.querySelector('#communityReplyBody').scrollIntoView({behavior:'smooth'});});card.querySelector('[data-report]')?.addEventListener('click',()=>reportDialog(postId));card.querySelector('[data-edit]')?.addEventListener('click',()=>editPostDialog(postId,threadId));card.querySelector('[data-hide]')?.addEventListener('click',async()=>{if(confirm('¿Ocultar esta publicación?')){await request(`moderation/threads/${threadId}`,{method:'POST',body:{isPinned:null,isLocked:null,isArchived:null,isHidden:true,moveToCategoryId:null,reason:'Ocultación desde la interfaz'}});openThread(threadId);}});});}
function renderPoll(poll){if(!poll)return'';return `<form id="communityPoll" class="community-card"><h3>${esc(poll.question)}</h3>${poll.options.map(option=>`<label class="community-poll-option"><input type="${poll.allowMultiple?'checkbox':'radio'}" name="pollOption" value="${option.id}" ${option.currentUserVoted?'checked':''}><span>${esc(option.text)} — ${option.voteCount}</span></label>`).join('')}<button class="community-small-button" type="submit">Votar</button></form>`;}
function wirePoll(threadId){const form=root.querySelector('#communityPoll');if(!form)return;form.addEventListener('submit',async event=>{event.preventDefault();const optionIds=[...form.querySelectorAll('input:checked')].map(x=>Number(x.value));try{await request(`threads/${threadId}/poll/vote`,{method:'POST',body:{optionIds}});openThread(threadId);}catch(error){alert(error.message);}});}
function reportDialog(postId){openModal(`<h2>Denunciar publicación</h2><form id="reportForm"><div class="community-form-row"><label>Motivo</label><input id="reportReason" is="emby-input" required maxlength="100"></div><div class="community-form-row"><label>Comentario</label><textarea id="reportComment" is="emby-input" maxlength="2000"></textarea></div><div class="community-actions"><button is="emby-button" class="raised button-submit" type="submit">Enviar</button><button type="button" class="community-small-button" data-close>Cancelar</button></div></form>`);modalBody.querySelector('#reportForm').addEventListener('submit',async event=>{event.preventDefault();try{await request(`posts/${postId}/report`,{method:'POST',body:{reason:modalBody.querySelector('#reportReason').value,comment:modalBody.querySelector('#reportComment').value}});closeModal();alert('Denuncia registrada.');}catch(error){alert(error.message);}});}
function editPostDialog(postId,threadId){const card=root.querySelector(`[data-post="${postId}"]`);const current=card?.querySelector('.body')?.innerText||'';openModal(`<h2>Editar publicación</h2><form id="editForm"><textarea id="editBody" is="emby-input" required>${esc(current)}</textarea><div class="community-form-row"><label>Motivo de la edición</label><input id="editReason" is="emby-input"></div><div class="community-actions"><button is="emby-button" class="raised button-submit" type="submit">Guardar</button><button type="button" class="community-small-button" data-close>Cancelar</button></div></form>`);modalBody.querySelector('#editForm').addEventListener('submit',async event=>{event.preventDefault();try{await request(`posts/${postId}`,{method:'PUT',body:{body:modalBody.querySelector('#editBody').value,containsSpoiler:false,spoilerItemId:null,spoilerLabel:null,editReason:modalBody.querySelector('#editReason').value}});closeModal();openThread(threadId);}catch(error){alert(error.message);}});}
function newThreadDialog(){if(!state.categories.length)return alert('No hay categorías disponibles.');openModal(`<h2>Nueva conversación</h2><form id="newThreadForm"><div class="community-form-row"><label>Categoría</label><select id="newCategory" is="emby-select">${state.categories.filter(c=>!c.isArchived).map(c=>`<option value="${c.id}" ${state.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="community-form-row"><label>Tipo</label><select id="newKind" is="emby-select"><option value="0">Debate</option><option value="1">Reseña</option><option value="2">Encuesta</option>${state.me.isModerator?'<option value="3">Anuncio</option>':''}</select></div><div class="community-form-row"><label>Título</label><input id="newTitle" is="emby-input" required maxlength="200"></div><div class="community-form-row"><label>Mensaje</label><textarea id="newBody" is="emby-input" required maxlength="20000"></textarea></div><div class="community-form-row"><label>Etiquetas, separadas por comas</label><input id="newTags" is="emby-input"></div><div class="checkboxContainer"><label><input id="newSpoiler" type="checkbox" is="emby-checkbox"><span>Contiene spoilers</span></label></div><div id="newPollFields" class="community-hidden"><div class="community-form-row"><label>Pregunta</label><input id="newPollQuestion" is="emby-input"></div><div class="community-form-row"><label>Opciones, una por línea</label><textarea id="newPollOptions" is="emby-input"></textarea></div><div class="checkboxContainer"><label><input id="newPollMultiple" type="checkbox" is="emby-checkbox"><span>Permitir varias opciones</span></label></div></div><div class="community-actions"><button is="emby-button" class="raised button-submit" type="submit">Crear</button><button type="button" class="community-small-button" data-close>Cancelar</button></div></form>`);const kind=modalBody.querySelector('#newKind');kind.addEventListener('change',()=>modalBody.querySelector('#newPollFields').classList.toggle('community-hidden',kind.value!=='2'));modalBody.querySelector('#newThreadForm').addEventListener('submit',async event=>{event.preventDefault();const poll=kind.value==='2'?{question:modalBody.querySelector('#newPollQuestion').value,allowMultiple:modalBody.querySelector('#newPollMultiple').checked,closesUtc:null,options:modalBody.querySelector('#newPollOptions').value.split(/\r?\n/).filter(Boolean)}:null;try{const result=await request('threads',{method:'POST',body:{categoryId:Number(modalBody.querySelector('#newCategory').value),kind:Number(kind.value),title:modalBody.querySelector('#newTitle').value,body:modalBody.querySelector('#newBody').value,itemId:state.itemId,itemName:state.itemName,tags:modalBody.querySelector('#newTags').value.split(',').map(x=>x.trim()).filter(Boolean),containsSpoiler:modalBody.querySelector('#newSpoiler').checked,spoilerItemId:state.itemId,spoilerLabel:null,poll}});closeModal();openThread(result.thread.id);}catch(error){alert(error.message);}});}
function moderationDialog(thread){openModal(`<h2>Moderar conversación</h2><form id="moderateForm"><div class="checkboxContainer"><label><input id="modPinned" type="checkbox" is="emby-checkbox" ${thread.isPinned?'checked':''}><span>Fijada</span></label></div><div class="checkboxContainer"><label><input id="modLocked" type="checkbox" is="emby-checkbox" ${thread.isLocked?'checked':''}><span>Cerrada</span></label></div><div class="checkboxContainer"><label><input id="modArchived" type="checkbox" is="emby-checkbox" ${thread.isArchived?'checked':''}><span>Archivada</span></label></div><div class="checkboxContainer"><label><input id="modHidden" type="checkbox" is="emby-checkbox" ${thread.isHidden?'checked':''}><span>Oculta</span></label></div><div class="community-form-row"><label>Mover a categoría</label><select id="modCategory" is="emby-select"><option value="">Sin cambio</option>${state.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="community-form-row"><label>Motivo</label><input id="modReason" is="emby-input"></div><div class="community-actions"><button is="emby-button" class="raised button-submit" type="submit">Aplicar</button><button type="button" class="community-small-button" data-close>Cancelar</button></div></form>`);modalBody.querySelector('#moderateForm').addEventListener('submit',async event=>{event.preventDefault();try{await request(`moderation/threads/${thread.id}`,{method:'POST',body:{isPinned:modalBody.querySelector('#modPinned').checked,isLocked:modalBody.querySelector('#modLocked').checked,isArchived:modalBody.querySelector('#modArchived').checked,isHidden:modalBody.querySelector('#modHidden').checked,moveToCategoryId:Number(modalBody.querySelector('#modCategory').value)||null,reason:modalBody.querySelector('#modReason').value}});closeModal();openThread(thread.id);}catch(error){alert(error.message);}});}
async function renderNotifications(){Dashboard.showLoadingMsg();try{const data=await request('notifications?page=1&pageSize=100');main.innerHTML=`<div class="community-actions"><button class="community-small-button" id="markAllRead">Marcar todo leído</button></div>${data.items.length?data.items.map(n=>`<article class="community-card community-notification ${n.isRead?'':'unread'}" data-notification="${n.id}" data-thread="${n.threadId||''}"><strong>${esc(n.title)}</strong><p>${esc(n.message)}</p><div class="community-meta">${formatDate(n.createdUtc)}</div></article>`).join(''):'<div class="community-empty">No hay notificaciones.</div>'}`;main.querySelector('#markAllRead').addEventListener('click',async()=>{await request('notifications/read',{method:'POST',body:{notificationIds:[],markAll:true}});renderNotifications();});main.querySelectorAll('[data-notification]').forEach(card=>card.addEventListener('click',async()=>{await request('notifications/read',{method:'POST',body:{notificationIds:[Number(card.dataset.notification)],markAll:false}});if(card.dataset.thread)openThread(Number(card.dataset.thread));else renderNotifications();}));}catch(error){setBanner(error.message,true);}finally{Dashboard.hideLoadingMsg();}}
async function renderModeration(){Dashboard.showLoadingMsg();try{const data=await request('moderation/reports?state=0&page=1&pageSize=100');main.innerHTML=data.items.length?data.items.map(r=>`<article class="community-card"><h3>${esc(r.reason)}</h3><p>${esc(r.comment||'Sin comentario')}</p><div class="community-meta"><span>${esc(r.reporterName)}</span><span>${formatDate(r.createdUtc)}</span><span>Mensaje ${r.postId}</span></div><div class="community-actions"><button class="community-small-button" data-resolve="${r.id}" data-state="2">Resolver</button><button class="community-small-button" data-resolve="${r.id}" data-state="3">Rechazar</button><button class="community-small-button" data-thread-open="${r.threadId}">Abrir conversación</button></div></article>`).join(''):'<div class="community-empty">No hay denuncias abiertas.</div>';main.querySelectorAll('[data-resolve]').forEach(button=>button.addEventListener('click',async()=>{const resolution=prompt('Resolución:');if(!resolution)return;await request(`moderation/reports/${button.dataset.resolve}/resolve`,{method:'POST',body:{state:Number(button.dataset.state),resolution}});renderModeration();}));main.querySelectorAll('[data-thread-open]').forEach(button=>button.addEventListener('click',()=>openThread(Number(button.dataset.threadOpen))));}catch(error){setBanner(error.message,true);}finally{Dashboard.hideLoadingMsg();}}
async function renderAdmin(){Dashboard.showLoadingMsg();try{const stats=await request('admin/stats');main.innerHTML=`<div class="community-admin-grid"><div class="community-card community-stat"><span>Base de datos</span><strong>${formatBytes(stats.databaseBytes)}</strong></div><div class="community-card community-stat"><span>Adjuntos</span><strong>${formatBytes(stats.attachmentsBytes)}</strong></div><div class="community-card community-stat"><span>Copias</span><strong>${formatBytes(stats.backupsBytes)}</strong></div><div class="community-card community-stat"><span>Conversaciones</span><strong>${stats.threads}</strong></div><div class="community-card community-stat"><span>Mensajes</span><strong>${stats.posts}</strong></div><div class="community-card community-stat"><span>Denuncias abiertas</span><strong>${stats.openReports}</strong></div></div><div class="community-card"><h3>Mantenimiento</h3><div class="community-actions"><button class="community-small-button" id="adminCleanup">Limpiar ahora</button><button class="community-small-button" id="adminIntegrity">Comprobar integridad</button><button class="community-small-button" id="adminBackup">Crear y descargar copia</button></div></div>`;main.querySelector('#adminCleanup').addEventListener('click',async()=>{const result=await request('admin/maintenance/cleanup',{method:'POST'});alert(`Limpieza finalizada: ${result.notifications} notificaciones, ${result.drafts} borradores y ${result.attachments} adjuntos.`);renderAdmin();});main.querySelector('#adminIntegrity').addEventListener('click',async()=>{const result=await request('admin/maintenance/integrity');alert('Integridad: '+result.result);});main.querySelector('#adminBackup').addEventListener('click',()=>window.open(apiUrl('admin/backups'),'_blank'));}catch(error){setBanner(error.message,true);}finally{Dashboard.hideLoadingMsg();}}
function formatBytes(bytes){if(!Number.isFinite(bytes))return'0 B';const units=['B','KB','MB','GB','TB'];let value=bytes,index=0;while(value>=1024&&index<units.length-1){value/=1024;index++;}return value.toFixed(index?1:0)+' '+units[index];}
root.querySelectorAll('.community-tab').forEach(tab=>tab.addEventListener('click',()=>{state.view=tab.dataset.view;state.page=1;render();}));root.querySelector('#communityNewThread').addEventListener('click',newThreadDialog);root.querySelector('#communitySearchButton').addEventListener('click',()=>{state.query=root.querySelector('#communitySearch').value.trim();state.page=1;state.view='threads';render();});root.querySelector('#communitySearch').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();root.querySelector('#communitySearchButton').click();}});root.addEventListener('pageshow',init,{once:true});if(root.classList.contains('ui-page-active'))init();
})();
</script>
</div>
</body>
</html>
