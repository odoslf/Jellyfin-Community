name: Publish Community 1.3.0.0

on:
  push:
    branches: ['publish/1.3.0.0']

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: 1.3.0.0
      VALIDATED_BRANCH: release/1.3.0.0
      VALIDATION_WORKFLOW: Build, validate and run Jellyfin 10.10.7 E2E
      ARTIFACT_NAME: Jellyfin.Plugin.Community-1.3.0.0-net8-validated
      PACKAGE_NAME: Jellyfin.Plugin.Community_1.3.0.0.zip
      TAG: v1.3.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Require successful validation for this exact commit
        id: validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.name == \"$VALIDATION_WORKFLOW\") | select(.head_branch == \"$VALIDATED_BRANCH\") | .id" \
            | head -n 1)"
          if [ -z "$RUN_ID" ]; then
            echo "No successful validation run exists for $GITHUB_SHA on $VALIDATED_BRANCH." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using validated workflow run $RUN_ID for commit $GITHUB_SHA."

      - name: Download the exact validated artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.validation.outputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf release-artifact
          mkdir -p release-artifact
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir release-artifact
          test -f "release-artifact/artifacts/$PACKAGE_NAME"
          test -f "release-artifact/artifacts/VALIDATION-REPORT.md"
          test -f "release-artifact/artifacts/e2e-user-mobile.png"
          test -f "release-artifact/artifacts/e2e-admin-mobile.png"
          test -f "release-artifact/artifacts/community-json-contract.json"
          test -f "release-artifact/artifacts/community-index-headers.txt"
          test -f "release-artifact/artifacts/community-index.html"

      - name: Verify package and generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifact/artifacts
          unzip -t "$PACKAGE_NAME"
          test "$(unzip -Z1 "$PACKAGE_NAME" | wc -l)" -eq 2
          unzip -Z1 "$PACKAGE_NAME" | sort | diff -u <(printf '%s\n' 'Jellyfin.Plugin.Community.dll' 'Markdig.dll' | sort) -
          SHA256="$(sha256sum "$PACKAGE_NAME" | awk '{print $1}')"
          MD5="$(md5sum "$PACKAGE_NAME" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA256" "$PACKAGE_NAME" > "$PACKAGE_NAME.sha256"
          printf '%s  %s\n' "$MD5" "$PACKAGE_NAME" > "$PACKAGE_NAME.md5"
          echo "SHA256=$SHA256"
          echo "MD5=$MD5"

      - name: Create GitHub release from validated bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace published bytes." >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          Community 1.3.0.0 for Jellyfin Server 10.10.7 / .NET 8.

          This release specifically addresses the failures observed on a real Jellyfin installation with 1.2: Community not appearing in the normal user navigation, blank category labels, `Cannot read properties of undefined (reading 'length')`, and thread creation failing with a generic Community error.

          The web integration now serves a transformed physical Jellyfin `index.html` before the static-file `SendFile` path, adds explicit no-cache headers, and injects the Community bootstrap for ordinary users and administrators. The 1.3 controller also normalizes both PascalCase and camelCase Jellyfin/ASP.NET JSON payloads before the UI reads them, including categories, paged results, permissions, threads and administration data. An elevated Jellyfin menu entry remains as an administrator fallback.

          Publication is gated on the exact artifact passing: .NET 8 Release build with warnings as errors, unit tests, dependency vulnerability audit, official Jellyfin 10.10.7 container startup, authenticated API E2E, a direct check that the real server response for `/web/index.html` contains the Community bootstrap and no-cache headers, a PascalCase/camelCase frontend contract test, and Chromium mobile E2E for an ordinary user and an administrator including normal navigation, thread creation and administrator controls.

          This release remains intentionally pinned to Jellyfin 10.10.7 (catalog ABI 10.10.7.0).
          EOF
          gh release create "$TAG" \
            "release-artifact/artifacts/$PACKAGE_NAME" \
            "release-artifact/artifacts/$PACKAGE_NAME.md5" \
            "release-artifact/artifacts/$PACKAGE_NAME.sha256" \
            "release-artifact/artifacts/VALIDATION-REPORT.md" \
            "release-artifact/artifacts/community-json-contract.json" \
            "release-artifact/artifacts/community-index-headers.txt" \
            "release-artifact/artifacts/e2e-user-mobile.png" \
            "release-artifact/artifacts/e2e-admin-mobile.png" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Jellyfin Community 1.3.0.0" \
            --notes-file release-notes.md

      - name: Verify published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -qx "$PACKAGE_NAME" <<< "$ASSETS"
          grep -qx "$PACKAGE_NAME.md5" <<< "$ASSETS"
          grep -qx "$PACKAGE_NAME.sha256" <<< "$ASSETS"
          grep -qx 'VALIDATION-REPORT.md' <<< "$ASSETS"
          grep -qx 'community-json-contract.json' <<< "$ASSETS"
          grep -qx 'community-index-headers.txt' <<< "$ASSETS"
          grep -qx 'e2e-user-mobile.png' <<< "$ASSETS"
          grep -qx 'e2e-admin-mobile.png' <<< "$ASSETS"
