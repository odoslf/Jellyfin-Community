name: Publish Community 1.6.0.0

on:
  workflow_run:
    workflows: ["Build, validate and run Jellyfin 10.10.7 E2E"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: 1.6.0.0
      TAG: v1.6.0.0
      PACKAGE: Jellyfin.Plugin.Community_1.6.0.0.zip
      ARTIFACT: Jellyfin.Plugin.Community-1.6.0.0-net8-validated
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm exact validated main commit
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.workflow_run.head_sha }}" = "$(git rev-parse HEAD)"
          subject="$(git log -1 --pretty=%s)"
          if [ "$subject" = "release: publish Community 1.6.0.0 in Jellyfin catalog" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Catalog-only release commit detected; publication loop stopped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify exact validated package
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-artifact
          mkdir release-artifact
          gh run download "${{ github.event.workflow_run.id }}" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir release-artifact
          if [ -d release-artifact/artifacts ]; then
            cp -a release-artifact/artifacts/. release-artifact/
          fi
          test -f "release-artifact/$PACKAGE"
          test -f release-artifact/VALIDATION-REPORT.md
          test -f release-artifact/runtime-api-e2e.json
          test -f release-artifact/runtime-channel-e2e.json
          test -f release-artifact/runtime-browser-e2e.txt
          test -f release-artifact/community-web-config.json
          test -f release-artifact/e2e-user-mobile.png
          test -f release-artifact/e2e-admin-mobile.png
          test -f release-artifact/e2e-admin-settings.png
          unzip -t "release-artifact/$PACKAGE"
          test "$(unzip -Z1 "release-artifact/$PACKAGE" | wc -l)" -eq 2
          unzip -Z1 "release-artifact/$PACKAGE" | sort | diff -u <(printf '%s\n' 'Jellyfin.Plugin.Community.dll' 'Markdig.dll' | sort) -
          cd release-artifact
          sha256sum "$PACKAGE" > "$PACKAGE.sha256"
          md5sum "$PACKAGE" > "$PACKAGE.md5"

      - name: Replace release with the validated main artifact
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          else
            git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true
          fi
          gh release create "$TAG" \
            "release-artifact/$PACKAGE" \
            "release-artifact/$PACKAGE.md5" \
            "release-artifact/$PACKAGE.sha256" \
            "release-artifact/VALIDATION-REPORT.md" \
            "release-artifact/runtime-api-e2e.json" \
            "release-artifact/runtime-channel-e2e.json" \
            "release-artifact/runtime-browser-e2e.txt" \
            "release-artifact/community-web-config.json" \
            "release-artifact/e2e-user-mobile.png" \
            "release-artifact/e2e-admin-mobile.png" \
            "release-artifact/e2e-admin-settings.png" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "Jellyfin Community 1.6.0.0" \
            --notes "Community 1.6.0.0 final para Jellyfin 10.10.7 / .NET 8. Validada en Jellyfin real: API, permisos, usuario normal, canal nativo Foro, Web/Playwright, empaquetado y logs."

      - name: Update Jellyfin catalog to exact released package
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os
          from pathlib import Path
          path = Path("manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          package = Path("release-artifact") / os.environ["PACKAGE"]
          entry = {
              "version": os.environ["VERSION"],
              "changelog": "Versión final validada en Jellyfin 10.10.7: foro Web, usuarios normales, permisos, moderación y canal nativo Foro.",
              "targetAbi": "10.10.7.0",
              "sourceUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG']}/{os.environ['PACKAGE']}",
              "checksum": hashlib.md5(package.read_bytes()).hexdigest().upper(),
              "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              "dependencies": []
          }
          data[0]["versions"] = [entry]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json
          git diff --cached --quiet || git commit -m "release: publish Community 1.6.0.0 in Jellyfin catalog"
          git push origin HEAD:main
