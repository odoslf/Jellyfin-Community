name: Publish Community 1.2.0.0

on:
  push:
    branches: ['publish/1.2.0.0']

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: 1.2.0.0
      VALIDATED_BRANCH: release/1.2.0.0
      VALIDATION_WORKFLOW: Build, validate and run Jellyfin 10.10.7 E2E
      ARTIFACT_NAME: Jellyfin.Plugin.Community-1.2.0.0-net8-validated
      PACKAGE_NAME: Jellyfin.Plugin.Community_1.2.0.0.zip
      TAG: v1.2.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Require successful validation for this exact commit
        id: validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.name == \"$VALIDATION_WORKFLOW\") | select(.head_branch == \"$VALIDATED_BRANCH\") | .id" \
            | head -n 1)"
          if [ -z "$RUN_ID" ]; then
            echo "No successful validation run exists for $GITHUB_SHA on $VALIDATED_BRANCH." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using validated workflow run $RUN_ID for commit $GITHUB_SHA."

      - name: Download the exact validated artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.validation.outputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf release-artifact
          mkdir -p release-artifact
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir release-artifact
          test -f "release-artifact/$PACKAGE_NAME"
          test -f "release-artifact/VALIDATION-REPORT.md"
          test -f "release-artifact/e2e-user-mobile.png"
          test -f "release-artifact/e2e-admin-mobile.png"

      - name: Verify package and generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifact
          unzip -t "$PACKAGE_NAME"
          test "$(unzip -Z1 "$PACKAGE_NAME" | wc -l)" -eq 2
          unzip -Z1 "$PACKAGE_NAME" | sort | diff -u <(printf '%s\n' 'Jellyfin.Plugin.Community.dll' 'Markdig.dll' | sort) -
          SHA256="$(sha256sum "$PACKAGE_NAME" | awk '{print $1}')"
          MD5="$(md5sum "$PACKAGE_NAME" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA256" "$PACKAGE_NAME" > "$PACKAGE_NAME.sha256"
          printf '%s  %s\n' "$MD5" "$PACKAGE_NAME" > "$PACKAGE_NAME.md5"
          echo "SHA256=$SHA256"
          echo "MD5=$MD5"

      - name: Create GitHub release from validated bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace published bytes." >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          Community 1.2.0.0 for Jellyfin Server 10.10.7 / .NET 8.

          This release is published only from the exact artifact that passed the repository's full validation gate: Release build with warnings as errors, 23 .NET tests, dependency vulnerability audit, real Jellyfin 10.10.7 startup, authenticated API E2E for ordinary/admin users, and Chromium E2E on Jellyfin Web including menu integration, thread creation, administrator controls, mobile layout and unobstructed Community toolbar controls.

          The release remains intentionally pinned to Jellyfin 10.10.7 (catalog ABI 10.10.7.0).
          EOF
          gh release create "$TAG" \
            "release-artifact/$PACKAGE_NAME" \
            "release-artifact/$PACKAGE_NAME.md5" \
            "release-artifact/$PACKAGE_NAME.sha256" \
            "release-artifact/VALIDATION-REPORT.md" \
            "release-artifact/e2e-user-mobile.png" \
            "release-artifact/e2e-admin-mobile.png" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Jellyfin Community 1.2.0.0" \
            --notes-file release-notes.md

      - name: Verify published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -qx "$PACKAGE_NAME" <<< "$ASSETS"
          grep -qx "$PACKAGE_NAME.md5" <<< "$ASSETS"
          grep -qx "$PACKAGE_NAME.sha256" <<< "$ASSETS"
          grep -qx 'VALIDATION-REPORT.md' <<< "$ASSETS"
          grep -qx 'e2e-user-mobile.png' <<< "$ASSETS"
          grep -qx 'e2e-admin-mobile.png' <<< "$ASSETS"
