name: Build, validate and run Jellyfin 10.10.7 E2E

on:
  push:
    branches: [main, 'release/**', 'release-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: community-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      NUGET_XMLDOC_MODE: skip
      JELLYFIN_URL: http://127.0.0.1:8096
      COMMUNITY_VERSION: 1.4.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.423

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate web source syntax and JSON contract
        shell: bash
        run: |
          set -euo pipefail
          node --check src/Jellyfin.Plugin.Community/Web/communityBootstrap.js
          cp src/Jellyfin.Plugin.Community/Web/communityPageController.js "$RUNNER_TEMP/communityPageController.mjs"
          node --check "$RUNNER_TEMP/communityPageController.mjs"
          cp src/Jellyfin.Plugin.Community/Web/communityPageController13.js "$RUNNER_TEMP/communityPageController13.mjs"
          node --check "$RUNNER_TEMP/communityPageController13.mjs"
          node tests/e2e/community_json_contract.mjs | tee community-json-contract.json
          python -m py_compile tests/e2e/community_api_e2e.py
          python -m py_compile scripts/create-validation-report.py
          node --check tests/e2e/community_browser_e2e.mjs
          if grep -qi '<script' src/Jellyfin.Plugin.Community/Web/community.html; then
            echo 'Community page must not contain inline scripts.' >&2
            exit 1
          fi
          grep -q 'data-controller="CommunityPageController"' src/Jellyfin.Plugin.Community/Web/community.html
          grep -q "const VERSION = '1.4.0.0'" src/Jellyfin.Plugin.Community/Web/communityBootstrap.js
          grep -q 'CommunityPageControllerLegacy' src/Jellyfin.Plugin.Community/Plugin.cs

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.Community.sln --force-evaluate

      - name: Build with static analysis
        run: dotnet build Jellyfin.Plugin.Community.sln -c Release --no-restore --warnaserror

      - name: Test with coverage
        run: dotnet test Jellyfin.Plugin.Community.sln -c Release --no-build --logger "trx;LogFileName=community-tests.trx" --collect:"XPlat Code Coverage"

      - name: Audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          dotnet list Jellyfin.Plugin.Community.sln package --vulnerable --include-transitive | tee vulnerability-audit.txt
          if grep -Eiq 'has the following vulnerable packages|\b(Critical|High|Moderate|Low)\b' vulnerability-audit.txt; then
            echo 'Vulnerable dependency detected.' >&2
            exit 1
          fi

      - name: Publish and package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts/publish
          dotnet publish src/Jellyfin.Plugin.Community/Jellyfin.Plugin.Community.csproj -c Release --no-restore -o artifacts/publish
          python3 scripts/package.py --publish artifacts/publish --output "artifacts/Jellyfin.Plugin.Community_${COMMUNITY_VERSION}.zip"
          unzip -t "artifacts/Jellyfin.Plugin.Community_${COMMUNITY_VERSION}.zip"
          test "$(unzip -Z1 "artifacts/Jellyfin.Plugin.Community_${COMMUNITY_VERSION}.zip" | wc -l)" -eq 2
          unzip -Z1 "artifacts/Jellyfin.Plugin.Community_${COMMUNITY_VERSION}.zip" | sort | diff -u <(printf '%s\n' 'Jellyfin.Plugin.Community.dll' 'Markdig.dll' | sort) -
          cp community-json-contract.json artifacts/community-json-contract.json

      - name: Start official Jellyfin 10.10.7 with packaged plugin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf e2e-runtime
          mkdir -p "e2e-runtime/config/plugins/Community_${COMMUNITY_VERSION}" e2e-runtime/cache
          unzip -q "artifacts/Jellyfin.Plugin.Community_${COMMUNITY_VERSION}.zip" -d "e2e-runtime/config/plugins/Community_${COMMUNITY_VERSION}"
          chmod -R a+rwX e2e-runtime
          docker pull jellyfin/jellyfin:10.10.7
          docker run -d --name jellyfin-community-e2e \
            -p 8096:8096 \
            -v "$PWD/e2e-runtime/config:/config" \
            -v "$PWD/e2e-runtime/cache:/cache" \
            jellyfin/jellyfin:10.10.7

      - name: Real Jellyfin API integration test
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/e2e/community_api_e2e.py | tee artifacts/runtime-api-e2e.json
          test -s artifacts/runtime-api-e2e.json

      - name: Verify real Jellyfin index injection and uncached web resources
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 1 \
            -D artifacts/community-index-headers.txt \
            -o artifacts/community-index.html \
            "$JELLYFIN_URL/web/index.html?community-ci=$GITHUB_SHA"
          grep -q 'data-jellyfin-community-bootstrap' artifacts/community-index.html
          grep -q 'CommunityBootstrap' artifacts/community-index.html
          grep -Eiq '^cache-control:.*no-cache' artifacts/community-index-headers.txt
          curl -fsS "$JELLYFIN_URL/web/ConfigurationPage?name=CommunityPageController&v=${COMMUNITY_VERSION}" \
            -o artifacts/community-controller-13.js
          grep -q 'CommunityPageController13' artifacts/community-controller-13.js
          grep -q 'normalizeCommunityJson' artifacts/community-controller-13.js

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Real Jellyfin Web browser test
        shell: bash
        run: |
          set -euo pipefail
          node tests/e2e/community_browser_e2e.mjs | tee artifacts/runtime-browser-e2e.txt
          test -s artifacts/runtime-browser-e2e.txt
          test -s artifacts/e2e-user-mobile.png
          test -s artifacts/e2e-admin-mobile.png
          test -s artifacts/e2e-admin-dashboard-route.png

      - name: Capture Jellyfin runtime logs
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p artifacts
          docker logs jellyfin-community-e2e > artifacts/jellyfin-10.10.7-runtime.log 2>&1 || true
          docker inspect jellyfin-community-e2e > artifacts/jellyfin-container-inspect.json 2>&1 || true

      - name: Assert Community runtime log is clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s artifacts/jellyfin-10.10.7-runtime.log ] && grep -E '\[ERR\].*Jellyfin\.Plugin\.Community|Jellyfin\.Plugin\.Community.*\[ERR\]' artifacts/jellyfin-10.10.7-runtime.log; then
            echo 'Community emitted an error in the real Jellyfin 10.10.7 runtime log.' >&2
            exit 1
          fi
          if [ -s artifacts/jellyfin-10.10.7-runtime.log ]; then
            grep -q 'Loaded plugin: Community 1.4.0.0' artifacts/jellyfin-10.10.7-runtime.log
            grep -q 'Jellyfin Community initialized' artifacts/jellyfin-10.10.7-runtime.log
          fi

      - name: Generate evidence-based validation report
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/create-validation-report.py \
            --root . \
            --artifacts artifacts \
            --dotnet-version "$(dotnet --version)" \
            --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output artifacts/VALIDATION-REPORT.md
          test -s artifacts/VALIDATION-REPORT.md

      - name: Stop runtime container
        if: always()
        run: docker rm -f jellyfin-community-e2e || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Jellyfin.Plugin.Community-1.4.0.0-net8-validated
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/Jellyfin.Plugin.Community_1.4.0.0.zip
            artifacts/Jellyfin.Plugin.Community_1.4.0.0.zip.sha256
            artifacts/VALIDATION-REPORT.md
            artifacts/runtime-api-e2e.json
            artifacts/runtime-browser-e2e.txt
            artifacts/community-json-contract.json
            artifacts/community-index-headers.txt
            artifacts/community-index.html
            artifacts/community-controller-13.js
            artifacts/e2e-user-mobile.png
            artifacts/e2e-admin-mobile.png
            artifacts/e2e-admin-dashboard-route.png
            artifacts/jellyfin-10.10.7-runtime.log
            artifacts/jellyfin-container-inspect.json
            vulnerability-audit.txt
            tests/**/TestResults/**/*.trx
            tests/**/TestResults/**/coverage.cobertura.xml
