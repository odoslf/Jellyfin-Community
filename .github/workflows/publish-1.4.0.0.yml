name: Publish Community 1.4.0.0

on:
  workflow_run:
    workflows: ["Build, validate and run Jellyfin 10.10.7 E2E"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: 1.4.0.0
      TAG: v1.4.0.0
      PACKAGE: Jellyfin.Plugin.Community_1.4.0.0.zip
      ARTIFACT: Jellyfin.Plugin.Community-1.4.0.0-net8-validated
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Refuse unvalidated or duplicate publication
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.workflow_run.head_sha }}" = "$(git rev-parse HEAD)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already published."
            exit 0
          fi

      - name: Download and verify exact validated package
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-artifact
          gh run download "${{ github.event.workflow_run.id }}" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir release-artifact
          test -f "release-artifact/$PACKAGE"
          unzip -t "release-artifact/$PACKAGE"
          test "$(unzip -Z1 "release-artifact/$PACKAGE" | wc -l)" -eq 2
          unzip -Z1 "release-artifact/$PACKAGE" | sort | diff -u <(printf '%s\n' 'Jellyfin.Plugin.Community.dll' 'Markdig.dll' | sort) -
          cd release-artifact
          sha256sum "$PACKAGE" > "$PACKAGE.sha256"
          md5sum "$PACKAGE" > "$PACKAGE.md5"

      - name: Create immutable GitHub release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG"             "release-artifact/$PACKAGE"             "release-artifact/$PACKAGE.md5"             "release-artifact/$PACKAGE.sha256"             "release-artifact/VALIDATION-REPORT.md"             "release-artifact/community-json-contract.json"             "release-artifact/e2e-user-mobile.png"             "release-artifact/e2e-admin-mobile.png"             --repo "$GITHUB_REPOSITORY"             --target "${{ github.event.workflow_run.head_sha }}"             --title "Jellyfin Community 1.4.0.0"             --notes "Community 1.4.0.0 for Jellyfin 10.10.7 / .NET 8. Uses the active Jellyfin session URL automatically behind reverse proxies and subpaths; users never configure a Community IP, domain, or port. Published only from the package that passed the complete API and Chromium E2E workflow."

      - name: Add validated release to Jellyfin catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os
          from pathlib import Path
          path = Path("manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          versions = data[0]["versions"]
          if any(item["version"] == os.environ["VERSION"] for item in versions):
              raise SystemExit(0)
          package = Path("release-artifact") / os.environ["PACKAGE"]
          versions.insert(0, {
              "version": os.environ["VERSION"],
              "changelog": "URL automática desde la sesión Jellyfin activa, compatible con proxy inverso y subrutas; no requiere configurar IP, dominio ni puerto. Conserva las correcciones funcionales de 1.3.",
              "targetAbi": "10.10.7.0",
              "sourceUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG']}/{os.environ['PACKAGE']}",
              "checksum": hashlib.md5(package.read_bytes()).hexdigest().upper(),
              "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              "dependencies": []
          })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json
          git diff --cached --quiet || git commit -m "release: publish Community 1.4.0.0 in Jellyfin catalog"
          git push origin HEAD:main
