changelog: >
  1.3 corrige la integración real observada en Jellyfin 10.10.7: la entrada
  Comunidad se inyecta desde el index.html físico antes del middleware de archivos
  estáticos, evitando SendFile/caché que impedía que el menú apareciera en algunos
  servidores y proxies. También normaliza de forma independiente las respuestas
  JSON de la API para que categorías, permisos, temas y administración funcionen
  tanto al abrir Community desde el menú como desde el panel de administración,
  y mejora los mensajes de error y el control de caché de los recursos web.
